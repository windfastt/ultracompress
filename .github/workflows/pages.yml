name: GitHub Pages

# Publishes ./docs/site to branch `gh-pages` for https://windfastt.github.io/ultracompress/

on:
  push:
    branches: [main, 'release/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify site artifacts, JSON dataset & JavaScript syntax
        run: |
          test -f docs/site/index.html
          test -f docs/site/benchmarks.html
          test -f docs/site/assets/style.css
          test -f docs/site/assets/main.js
          test -f docs/site/data/benchmarks.json
          python3 -m json.tool docs/site/data/benchmarks.json > /dev/null
          node --check docs/site/assets/main.js

      - name: Deploy static site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/site
          commit_message: 'deploy: update site from ${{ github.sha }}'
